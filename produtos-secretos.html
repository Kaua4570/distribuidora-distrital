<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#121212">
<title>Distribuidora Campos</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="produtos-secretos.css">
</head>
<body>

<!-- Porteiro: nada da área é exibido até o Firebase confirmar login + autorização -->
<div class="ps-porteiro" id="ps-porteiro"><div class="spinner" aria-label="Verificando acesso"></div></div>

<div id="ps-app" hidden>
  <header class="ps-topo">
    <div class="ps-marca">
      <img src="logo.png" alt="Distribuidora Campos">
      <div>
        <h1>Catálogo Reservado</h1>
        <small id="ps-usuario"></small>
      </div>
    </div>
    <div class="ps-acoes">
      <button type="button" class="ps-engrenagem" id="ps-admin" aria-label="Gerenciar produtos" title="Gerenciar" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </button>
      <button type="button" class="btn btn-outline btn-sm" id="ps-sair">Sair</button>
    </div>
  </header>

  <div class="ps-busca">
    <div class="busca-wrap">
      <input type="text" id="ps-busca" class="busca-input" placeholder="Buscar produto..." autocomplete="off">
      <span class="busca-icone">🔍</span>
    </div>
  </div>

  <nav class="cat-nav ps-nav" id="ps-cats" aria-label="Categorias"></nav>
  <div class="ps-contagem" id="ps-contagem"></div>
  <main class="ps-grade" id="ps-grade"></main>
</div>

<script type="module" src="produtos-secretos.js"></script>
</body>
</html>
