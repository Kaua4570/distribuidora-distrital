<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Distribuidora Distrital — Cardápio Digital</title>
<meta name="description" content="Peça bebidas, gelo e petiscos na Distribuidora Distrital.">
<meta name="theme-color" content="#121212">
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===================== HEADER ===================== -->
<header class="header">
  <div class="container header-top">
    <img src="logo.png" alt="Distribuidora Distrital" class="logo-img">
    <h1 class="header-boas-vindas">Bem-vindo à Distribuidora Distrital!</h1>
    <span id="status-loja" class="status-loja aberta"><span class="status-dot"></span> Loja aberta</span>
  </div>

  <div class="busca-wrap">
    <input type="text" id="busca-input" class="busca-input" placeholder="Buscar produto (ex: Skol, vinho...)" autocomplete="off">
    <span class="busca-icone">🔍</span>
  </div>
</header>

<!-- ===================== NAV CATEGORIAS ===================== -->
<nav class="cat-nav" id="cat-nav" aria-label="Categorias"></nav>

<!-- ===================== PRODUTOS ===================== -->
<main id="categorias-container">
  <div class="loading-full"><div class="spinner"></div><span>Carregando cardápio...</span></div>
</main>

<p class="rodape-nota">Distribuidora Distrital © 2026 — Cardápio digital</p>

<script type="module" src="app.js"></script>
<script type="module" src="acesso-secreto.js"></script>
</body>
</html>
